// Public alpha: damage bonus is untested and disabled by default.
// ARP Fighting 2.0.0-alpha.1. Loaded automatically by ARP_Fighting.
arp_fighting_enabled 1
arp_fighting_jobs 1
// Maximum percentage at skill 100. Whole numbers 0..25; invalid values disable bonus.
// Skill 16 => +4%; skill 50 => +12.5%; skill 100 => +25% when the configured maximum is 25.
// Set 0 to retain job choices but disable the damage bonus.
arp_fighting_bonus_percent 0
// Temporary combat diagnostics only; keep 0 for normal play.
arp_fighting_debug 0

// Minimum skill for menu job selection, whole number 0..100.
arp_fighting_job_skill 16
