// SkillWorks Skills 0.2.1 - self-study. Loaded automatically on each map.
// Payment comes from BANK, only when a lesson completes successfully.
// Existing skill points are preserved. No passive skill gains. Gameplay addons are separate plugins.
arp_skills_learning 1

// Whole seconds, 1..3600. Default 30. For testing you can set 5 in server console.
arp_skills_lesson_seconds 30

// Points per completed lesson, 1..100. Award stops at the skill cap (100).
// Full quoted price is charged even for a smaller award near the cap.
arp_skills_lesson_points 1

// Price per lesson, integer 0..1000000. Zero deliberately enables free lessons.
// These defaults match the original Harbu self-study menu.
arp_skills_cost_general 100
arp_skills_cost_computers 250
arp_skills_cost_fighting 250
arp_skills_cost_law 300
arp_skills_cost_weapons 300
arp_skills_cost_cooking 150
arp_skills_cost_drugs 200
