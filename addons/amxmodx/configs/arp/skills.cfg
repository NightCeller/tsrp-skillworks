// Whole numbers only. Changes to active-action settings cancel without reward/payment.
// SkillWorks Skills 3.0.0-alpha.1 - self-study. Loaded automatically on each map.
// Payment comes from BANK, only when a lesson completes successfully.
// Existing skill points are preserved. No passive skill gains. Gameplay addons are separate plugins.
arp_skills_learning 1

// Whole seconds, 1..3600. Default 30. For testing you can set 5 in server console.
arp_skills_lesson_seconds 30

// Points per completed lesson, 1..100. Award stops at the skill cap (100).
// Full quoted price is charged even for a smaller award near the cap.
arp_skills_lesson_points 1

// Price per lesson, integer 0..1000000. Zero deliberately enables free lessons.
// These defaults match the original Harbu self-study menu.
arp_skills_cost_general 100
arp_skills_cost_computers 250
arp_skills_cost_fighting 250
arp_skills_cost_law 300
arp_skills_cost_weapons 300
arp_skills_cost_cooking 150
arp_skills_cost_drugs 200

// V3 practical XP. Paid self-study remains available and keeps its existing prices.
// XP needed for next level = base + step * CURRENT level (20 => 200 by default).
// Whole integers only; invalid settings stop XP awards, not completed crafting.
arp_skills_xp_enabled 1
arp_skills_xp_base 100
arp_skills_xp_step 5
// Per-player, per-skill, persisted across reconnect/maps/restarts. Range 1..86400.
arp_skills_xp_cooldown 30
// Full XP up to this gap above activity requirement; half after; none at stop_gap.
// stop_gap must exceed full_gap. Easy activities eventually stop giving XP.
arp_skills_xp_full_gap 10
arp_skills_xp_stop_gap 25
// Per-success reward, range 0..10000. Zero disables that skill's practical XP.
arp_skills_xp_reward_general 10
arp_skills_xp_reward_computers 25
arp_skills_xp_reward_fighting 0
arp_skills_xp_reward_law 0
arp_skills_xp_reward_weapons 10
arp_skills_xp_reward_cooking 10
arp_skills_xp_reward_drugs 10
// Fighting/Law have no practical-award hooks in this alpha, even if set nonzero.
// No XP during a lesson; no XP for failed/cancelled crafts, item use or job changes.
