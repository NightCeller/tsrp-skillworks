// Whole numbers only. Changes to active-action settings cancel without reward/payment.
// Apollo Computers 3.0.0-alpha.1 - ATM gameplay. Reapplied each map.
arp_hack_enabled "1"
// Old Harbu source required Computers >30; minimum integer is 31.
arp_hack_skill "31"
arp_hack_seconds "60"
// Seconds AFTER scheduled finish. Cancellation still keeps the full lockout.
// Player and ATM cooldowns are saved in SQLite before the attempt starts.
arp_hack_cooldown "300"
// Newly created wallet money on success. Bank balances are never touched.
arp_hack_reward_min "50"
arp_hack_reward_max "150"
// Chance scales linearly between threshold skill and skill 100.
arp_hack_chance_min "50"
arp_hack_chance_max "90"
// Solo-server default. Police detection uses Apollo's ARP_IsCop access rules.
arp_hack_min_cops "0"
// Distance to the existing Apollo ATM zone, in game units; allowed 30..150.
arp_hack_radius "100"
// Notify online Apollo police at the start of each confirmed attempt.
arp_hack_alerts "1"
