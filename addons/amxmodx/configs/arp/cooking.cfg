// SkillWorks 2.0.0-alpha.1 - Cooking. Reapplied each map.
// Whole numbers only. Invalid settings block the affected recipe.
// Save edits here to retain them after restart. See docs/CONFIGURATION.md.
arp_cooking_enabled 1
// Ingredient shop charges WALLET. Set 0 when using NPC suppliers.
arp_cooking_supplies 1

// fries: enabled 0/1; skill 0..100; seconds 1..3600; cost 0..1000000.
// Cost buys ONE ingredient pack, not the finished food.
arp_cooking_enabled_fries 1
arp_cooking_skill_fries 10
arp_cooking_seconds_fries 30
arp_cooking_cost_fries 10

// hamburger: enabled 0/1; skill 0..100; seconds 1..3600; cost 0..1000000.
// Cost buys ONE ingredient pack, not the finished food.
arp_cooking_enabled_hamburger 1
arp_cooking_skill_hamburger 10
arp_cooking_seconds_hamburger 60
arp_cooking_cost_hamburger 35

// pizza: enabled 0/1; skill 0..100; seconds 1..3600; cost 0..1000000.
// Cost buys ONE ingredient pack, not the finished food.
arp_cooking_enabled_pizza 1
arp_cooking_skill_pizza 20
arp_cooking_seconds_pizza 60
arp_cooking_cost_pizza 25
